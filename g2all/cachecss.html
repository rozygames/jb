<!DOCTYPE html>
<html manifest="css.manifest">
<head>
<title>ROZY GAMES | Cache Offline PS4</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Memasang Cache Offline: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache berhasil dipasang ✔";setTimeout(function(){window.msgs.innerHTML="Sekarang tutup lalu buka kembali Browser PS4 ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Gagal memasang cache! Hapus data browser, lalu buka kembali ...";};
</script>
<h1>ROZY GAMES | CACHE OFFLINE PS4</h1>
